# Java has no `pip-audit` equivalent wired into CI; Dependabot is what keeps the Maven
# tree, the Python tree and the workflows themselves current.
#
# The ledger's, the gateway's and the assistant's Dockerfile base images are covered below. The
# image tags in docker-compose.yml (postgres, the monitoring services) are NOT: Dependabot's
# `docker` ecosystem fetches Dockerfiles, Containerfiles and Kubernetes manifests only, and there
# is no `docker-compose` ecosystem. Bump those tags by hand.
version: 2

# Every update targets `dev`, not the default branch. Dependabot defaults to `main`, which
# would put dependency bumps straight onto it and bypass the dev -> main flow the rest of the
# repository follows.

updates:
  # The ledger and the gateway are one Maven pair: the same Spring Boot, Spotless, JaCoCo and
  # wrapper. As separate entries they drifted apart, one PR per service, and the ledger's sat at
  # its PR limit while the gateway's moved on (#138). `group-by: dependency-name` makes one PR per
  # dependency that bumps it in both directories at once (ADR-045).
  - package-ecosystem: maven
    directories:
      - /backend/ledger
      - /backend/gateway
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      java-services:
        group-by: dependency-name
    ignore:
      # ADR-047 lets a Maven 3.x minor or patch wrapper move by the weekly triage, and holds a Maven
      # major to an ADR. This is the name Dependabot gives the wrapper (PR #118: "bump
      # org.apache.maven:apache-maven"). Delete this entry in the change that moves Maven to 4.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 4"]

  - package-ecosystem: docker
    directories:
      - /backend/ledger
      - /backend/gateway
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      java-services:
        group-by: dependency-name
    ignore:
      # ADR-002 holds the services on Java 21, the LTS release CI also builds on. Dependabot
      # offered Temurin 24, a non-LTS release, as a routine bump (#55, #103). The next Java line
      # is an ADR's to choose, not a weekly PR's; delete this entry in the change that records it.
      # 21.x patch releases still arrive.
      - dependency-name: "eclipse-temurin"
        versions: [">= 22"]

  # Bumps the quay.io/keycloak/keycloak tag in ops/keycloak/Dockerfile. The keycloak-db tag in
  # docker-compose.yml is a plain image reference, which this ecosystem does not fetch (see the
  # header comment above), so it is bumped by hand (#80). Keycloak is a runtime security
  # dependency: its PR goes to the owner before it merges (ADR-045).
  - package-ecosystem: docker
    directory: /ops/keycloak
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /backend/assistant
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /backend/assistant
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # ADR-003 chose Python 3.13, and `.python-version`, which CI tests on, and the Compose
      # services pinning python:3.13.x hold it there. A 3.14 image would run code CI never tested
      # (#268). Moving to 3.14 is an ADR's to choose, together with those pins; delete this entry
      # in that change. 3.13.x patch releases still arrive.
      - dependency-name: "python"
        versions: [">= 3.14"]

  - package-ecosystem: npm
    directory: /frontend/web
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # @vitest/coverage-v8 peer-depends on an exact vitest version, so a PR bumping one
      # without the other fails `npm ci` with ERESOLVE - the same way PR #5 did for TypeScript.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Pre-1.0 (ADR-029): a minor release may change the generated output, so a bump lands as
      # one grouped PR that regenerates src/shared/api/contracts, rather than several PRs each
      # claiming a clean diff the others already broke.
      #
      # frontend/web/package.json also carries a root `overrides` entry pinning the transitive
      # js-yaml @hey-api/openapi-ts pulls in (via @hey-api/json-schema-ref-parser, which
      # declares js-yaml 4.2.0 exactly) up to 4.3.2: 4.2.0 carries three high-severity
      # advisories - GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj and GHSA-2883-xcg3-v3hh, all
      # quadratic-CPU-consumption issues in YAML merge-key/omap handling - that fail
      # `npm audit --audit-level=high`. Drop the override once
      # @hey-api/json-schema-ref-parser (via @hey-api/openapi-ts) allows js-yaml >= 4.3.2 on
      # its own.
      hey-api:
        patterns:
          - "@hey-api/*"
      # react-dom peer-depends on the same react minor, and @types/react-dom on the same
      # @types/react minor, so a PR bumping one alone fails `npm ci` with ERESOLVE - PR #325 did
      # (ADR-062).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint 8.70.0 still declares `typescript: >=4.8.4 <6.1.0`. A bump past that makes
      # `npm ci` fail outright with ERESOLVE - PR #5 proved it, the Web job could not install.
      # Delete this entry the moment typescript-eslint declares support for 7 (ADR-009).
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # The types describe the runtime: .nvmrc, which CI's setup-node reads, and package.json's
      # engines both name Node 24, so @types/node stays on 24.x. Move it, and this entry, with the
      # runtime's major (ADR-062).
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "chore(ci)"
