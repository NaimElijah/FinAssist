# Java has no `pip-audit` equivalent wired into CI; Dependabot is what keeps the Maven
# tree, the Python tree and the workflows themselves current.
#
# The ledger's Dockerfile base images are covered below. The image tags in docker-compose.yml
# (postgres, the monitoring services) are NOT: Dependabot's `docker` ecosystem fetches
# Dockerfiles, Containerfiles and Kubernetes manifests only, and there is no `docker-compose`
# ecosystem. Bump those tags by hand, or add a `docker` entry once a service that owns one
# gets its own Dockerfile.
version: 2

# Every update targets `dev`, not the default branch. Dependabot defaults to `main`, which
# would put dependency bumps straight onto it and bypass the dev -> main flow the rest of the
# repository follows.

updates:
  - package-ecosystem: maven
    directory: /backend/ledger
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /backend/ledger
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /backend/assistant
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend/web
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # @vitest/coverage-v8 peer-depends on an exact vitest version, so a PR bumping one
      # without the other fails `npm ci` with ERESOLVE - the same way PR #5 did for TypeScript.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # typescript-eslint 8.68.0 declares `typescript: >=4.8.4 <6.1.0`. A bump past that makes
      # `npm ci` fail outright with ERESOLVE - PR #5 proved it, the Web job could not install.
      # Delete this entry the moment typescript-eslint declares support for 7 (ADR-009).
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "chore(ci)"
