# Gates every push and pull request. Jobs call the Makefile targets a developer runs
# locally, so the pipeline and the local commands cannot drift apart.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: Ledger (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Format check
        run: make lint-ledger

      - name: Build and test
        run: make test-ledger

      # Published for reading, never gated on. See docs/ADRs/ADR-017-test-strategy.md.
      # always(), because a coverage report is most wanted on the run that failed. Paired
      # with if-no-files-found: warn, since a job that fell over before its tests legitimately
      # produces none, and a second red step there would obscure the real failure.
      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-ledger
          path: backend/ledger/target/site/jacoco
          if-no-files-found: warn

  gateway:
    name: Gateway (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Format check
        run: make lint-gateway

      - name: Build and test
        run: make test-gateway

      # Published for reading, never gated on. See docs/ADRs/ADR-017-test-strategy.md.
      # always(), because a coverage report is most wanted on the run that failed. Paired
      # with if-no-files-found: warn, since a job that fell over before its tests legitimately
      # produces none, and a second red step there would obscure the real failure.
      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-gateway
          path: backend/gateway/target/site/jacoco
          if-no-files-found: warn

  assistant:
    name: Assistant (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # The interpreter is deliberately not pinned here: `uv sync` resolves it from
          # backend/assistant/.python-version and requires-python, so that file stays the single
          # source of truth. setup-uv has no `python-version-file` input.

      - name: Install locked dependencies
        run: cd backend/assistant && uv sync --locked --extra dev

      - name: Lint, format check and types
        run: make lint-assistant

      # ops/smoke/auth_smoke.py has no toolchain of its own, so it is linted here, with the
      # assistant's pinned ruff and mypy and the rules in its pyproject.toml (Refs #38).
      - name: Lint, format check and types (smoke check)
        run: make lint-smoke

      # ops/backup/backup.py, linted the same way and for the same reason (ADR-038).
      - name: Lint, format check and types (backup CLI)
        run: make lint-backup

      - name: Test (backup CLI)
        run: make test-backup

      # ops/secret_check/secret_check.py, linted the same way and for the same reason (ADR-044).
      - name: Lint, format check and types (secret check)
        run: make lint-secret-check

      - name: Test (secret check)
        run: make test-secret-check

      - name: Test
        run: make test-assistant

      # always(), because a coverage report is most wanted on the run that failed. Paired
      # with if-no-files-found: warn, since a job that fell over before its tests legitimately
      # produces none, and a second red step there would obscure the real failure.
      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-assistant
          path: backend/assistant/coverage.xml
          if-no-files-found: warn

      - name: Dependency audit
        run: make audit-assistant

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install locked dependencies
        run: cd frontend/web && npm ci

      # `git diff` compares tracked files only, so a file the generator newly emits would pass it
      # while the committed types stay incomplete. `git status --porcelain` lists untracked files
      # too, so either kind of drift fails the step, and the listing names the files.
      - name: Contract types are current
        run: |
          cd frontend/web && npm run generate:api
          git status --porcelain -- src/shared/api/contracts
          test -z "$(git status --porcelain -- src/shared/api/contracts)"

      - name: Lint, format check and types
        run: make lint-web

      - name: Test
        run: make test-web

      # always(), because a coverage report is most wanted on the run that failed. Paired
      # with if-no-files-found: warn, since a job that fell over before its tests legitimately
      # produces none, and a second red step there would obscure the real failure.
      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-web
          path: frontend/web/coverage
          if-no-files-found: warn

      - name: Build
        run: make build-web

      - name: Dependency audit
        run: make audit-web

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only/' .env
          sed -i 's/^LEDGER_DB_PASSWORD=$/LEDGER_DB_PASSWORD=ci-only/' .env
          sed -i 's/^GRAFANA_ADMIN_PASSWORD=$/GRAFANA_ADMIN_PASSWORD=ci-only/' .env
          sed -i 's/^KEYCLOAK_ADMIN_PASSWORD=$/KEYCLOAK_ADMIN_PASSWORD=ci-only/' .env
          sed -i 's/^KEYCLOAK_DB_PASSWORD=$/KEYCLOAK_DB_PASSWORD=ci-only/' .env
          sed -i 's/^FINASSIST_OWNER_INITIAL_PASSWORD=$/FINASSIST_OWNER_INITIAL_PASSWORD=ci-only-12-chars/' .env
          sed -i 's/^GATEWAY_CLIENT_SECRET=$/GATEWAY_CLIENT_SECRET=ci-only/' .env
          sed -i 's/^ASSISTANT_CLIENT_SECRET=$/ASSISTANT_CLIENT_SECRET=ci-only/' .env
          # --profile monitoring, or the three monitoring services are interpolated but never
          # validated, and a broken reference among them passes. --profile smoke does the same for
          # ops/smoke/auth_smoke.py's auth-smoke service (Refs #38); running the check itself
          # stays a manual step (`make smoke-auth`), never a CI job.
          docker compose --profile monitoring config --quiet
          docker compose --profile smoke config --quiet
          docker compose --profile monitoring --profile smoke config --quiet

      # Read from the resolved file, not its text, so an alias that stops resolving fails as surely
      # as a service that never took one, and a block copied in with other values fails too: each
      # service must equal the x- blocks themselves (Refs #142). Uses the .env the step above wrote.
      - name: Require the restart policy, log bound and readiness probes
        run: |
          docker compose --profile monitoring --profile smoke config --format json | python3 -c '
          import json, sys
          resolved = json.load(sys.stdin)
          services = resolved["services"]
          policy = resolved.get("x-restart-policy")
          bounded_logs = resolved.get("x-logging")
          one_shot = {"auth-smoke", "secret-check"}
          readiness = {
              "ledger": "/actuator/health/readiness",
              "gateway": "/actuator/health/readiness",
              "assistant": "/ready",
              "keycloak": "/health/ready",
          }
          problems = []
          if policy is None or bounded_logs is None:
              problems.append("the resolved file holds no x-restart-policy or x-logging block")
          for name, svc in sorted(services.items()):
              if name in one_shot:
                  if svc.get("restart") or svc.get("logging"):
                      problems.append(f"{name}: a one-shot service takes no restart or logging")
              elif svc.get("restart") != policy or svc.get("logging") != bounded_logs:
                  problems.append(f"{name}: needs restart and logging as the x- blocks set them")
          for name, path in readiness.items():
              healthcheck = (services.get(name) or {}).get("healthcheck") or {}
              if path not in " ".join(healthcheck.get("test") or []):
                  problems.append(f"{name}: its healthcheck must probe {path}")
          print("\n".join(problems) or "Every service follows the Compose conventions")
          sys.exit(1 if problems else 0)
          '

      # The gate's real wiring, which its own tests cannot reach (ADR-044). The .env above puts
      # `ci-only` or `ci-only-12-chars`, values this repository publishes, in every secret. So the
      # check must refuse all eight by name and never print the value, and `up` must leave `db`
      # unstarted; fresh values must then pass. One container and no database: seconds, not the
      # minutes that keep the smoke check out of CI (ADR-034). The reports go to $RUNNER_TEMP,
      # outside the clone the check reads, so the fresh values are never in a file it searches.
      - name: Refuse a published secret before any database starts
        run: |
          variables="POSTGRES_PASSWORD LEDGER_DB_PASSWORD KEYCLOAK_DB_PASSWORD"
          variables="$variables KEYCLOAK_ADMIN_PASSWORD FINASSIST_OWNER_INITIAL_PASSWORD"
          variables="$variables GATEWAY_CLIENT_SECRET"
          variables="$variables ASSISTANT_CLIENT_SECRET GRAFANA_ADMIN_PASSWORD"
          status=0
          docker compose run --rm secret-check > "$RUNNER_TEMP/refused.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/refused.txt"
          test "$status" -eq 1
          for name in $variables; do
            grep -q "REFUSED: $name appears" "$RUNNER_TEMP/refused.txt"
          done
          if grep -q "ci-only" "$RUNNER_TEMP/refused.txt"; then
            echo "the refusal printed a value"; exit 1
          fi
          if docker compose up -d db; then
            echo "db started on a published secret"; exit 1
          fi
          test -z "$(docker compose ps -q --status running db)"
          for name in $variables; do
            echo "$name=$(openssl rand -hex 16)"
          done > "$RUNNER_TEMP/fresh.env"
          docker compose --env-file "$RUNNER_TEMP/fresh.env" run --rm secret-check
