# Scrape configuration for the local monitoring profile.
#
# The ledger is scraped directly rather than pushing metrics through the collector: Actuator
# already serves /actuator/prometheus, and one hop is easier to debug than two. The collector is
# scraped as well, for anything a service pushes over OTLP.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # The monitoring profile scrapes the Compose ledger, by its service name on the shared Compose
  # network. A natively-run ledger bound to loopback (ADR-030, `./mvnw spring-boot:run`) is not
  # reachable this way and is not scraped.
  - job_name: finassist-ledger
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ledger:8080']
