[project]
name = "finassist-assistant"
version = "0.1.0"
description = "LLM assistant and portfolio analysis over the FinAssist ledger"
requires-python = ">=3.13"
# Not a file reference: the LICENSE lives at the repository root, outside this
# project directory, and hatchling refuses to package a path that escapes it.
license = { text = "Proprietary - all rights reserved. See LICENSE at the repository root." }

# Exact pins only. Ranges make a lockfile a suggestion; see docs/ADRs/ADR-003.
dependencies = [
    "fastapi==0.162.0",
    # Plain, never `[standard]`: the server runs `h11` with no WebSocket support (ADR-058), so
    # that extra's httptools, uvloop, websockets, watchfiles and pyyaml would ship unused.
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",      # structured logging; never `print`
    # Telemetry (ADR-019). The instrumentation package tracks the API/SDK on its own 0.x
    # line, which is why its version looks unlike the other two rather than being a typo.
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    # JWT bearer-token verification (ADR-032). The `crypto` extra brings `cryptography`,
    # which RS256 needs; the standard library has no JOSE support.
    "PyJWT[crypto]==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # Starlette's TestClient and the real-server tests' client. A test dependency only until a
    # ledger client exists, which chooses its own HTTP client then (#341).
    "httpx==0.28.1",
    # Property-based testing for the pure-function cores. Run derandomised (see
    # tests/conftest.py) so a commit that changed nothing can never go red on CI.
    "hypothesis==6.170.14",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finassist_assistant"]

# --- Formatter and linter: authoritative, per the repository conventions ------
[tool.ruff]
line-length = 100          # matches .editorconfig
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "T20",      # flake8-print — no print() in committed code
    "SIM",      # simplify
    "PTH",      # pathlib over os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Test names are the specification and follow Given_When_Then, which is not snake_case;
# N802 would otherwise force the convention out of the repository.
"tests/**" = ["S101", "N802"]
# The same convention for the backup CLI's tests, which borrow these settings (make test-backup),
# and for the secret check's (make test-secret-check) and the Compose check's
# (make test-compose-check).
"../../ops/backup/tests/**" = ["N802"]
"../../ops/secret_check/tests/**" = ["N802"]
"../../ops/compose_check/tests/**" = ["N802"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# The domain has no framework imports; nothing here may weaken that.
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# Test names are the specification: Given<scenario>_When<action>_Then<result>.
# The trailing underscore matters. pytest matches these with fnmatch, which is case-insensitive
# on Windows, so a bare "Given*" also matches Hypothesis's `given` decorator wherever it is
# imported - collecting it as a test locally but not on Linux CI, which is exactly the kind of
# drift between the two that ADR-005 exists to prevent.
python_functions = ["test_*", "Given_*"]


[tool.coverage.run]
source_pkgs = ["finassist_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
# No fail_under, deliberately. Coverage is a diagnostic here: it says which lines ran, never
# whether a test would have noticed them being wrong. A percentage gate rewards tests written
# to reach lines. See docs/ADRs/ADR-017-test-strategy.md.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol stub's body: a line that is only an ellipsis. Unanchored, the pattern matched any
    # `...`, such as `tuple[Lot, ...]` in a signature, and excluded that whole function with it.
    '^\s*\.\.\.\s*$',
]

