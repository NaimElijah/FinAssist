# Only what the baseline requires of any service: a configurable port, health and readiness
# endpoints, and the observability wiring ADR-019 records. Everything else arrives with the
# code that needs it.
server:
  port: ${LEDGER_PORT:8080}
  # Loopback by default, kept as defence in depth now that every business request also needs a
  # bearer token (ADR-030); a container overrides this with 0.0.0.0, because its own loopback is
  # unreachable from the host.
  address: ${LEDGER_ADDRESS:127.0.0.1}

finassist:
  http:
    # Host names the ledger answers to, compared without the port. Loopback alone does not stop
    # DNS rebinding: a hostile page whose name has been repointed at 127.0.0.1 is same-origin with
    # the ledger, yet every request it sends still names the page's own host. HostAllowListFilter
    # refuses those with 403, Actuator included (ADR-030).
    allowed-hosts: ${LEDGER_ALLOWED_HOSTS:localhost,127.0.0.1}
  security:
    # The issuer a token's iss claim must name. Always the public URL, never the internal one a
    # container reaches Keycloak by, because a token's iss can only name one and the browser is
    # the one that signed in (ADR-030, ADR-031).
    issuer: ${LEDGER_OIDC_ISSUER:http://localhost:8081/realms/finassist}
    # The internal JWKS URI: fetched service-to-service, so the Compose default is the
    # container-to-container address, never the browser-facing one.
    jwks-uri: ${LEDGER_OIDC_JWKS_URI:http://localhost:8081/realms/finassist/protocol/openid-connect/certs}
    # Fixed by ADR-030, not an environment variable: every ledger token names this
    # audience or is refused, regardless of which environment issued it.
    audience: finassist-ledger

springdoc:
  api-docs:
    # The ledger serves its contract on purpose (ADR-028), so the switch is set rather than left to
    # springdoc's default. Left unset, springdoc 3.1.1 serves the document anyway and warns at every
    # start-up that the endpoint "is enabled by default"; set, that warning is gone.
    enabled: true
  # LedgerContractIT compares the generated document with contracts/ledger-v1.openapi.json, so it
  # must be deterministic and hold only the contract (ADR-028). Sorted keys keep a regenerated
  # file's diff down to what actually changed.
  writer-with-order-by-keys: true
  # Actuator and anything else outside the versioned API stay out of the contract.
  paths-to-match: /api/v1/**

spring:
  jackson:
    deserialization:
      # A fraction is not an integer. Jackson 3 truncates one into an int member by default, so
      # "interval": 1.5 would quietly plan a recurrence the client never sent. Off, it is a
      # malformed body and a 400, like any other wrong type (ADR-028).
      accept-float-as-int: false

  application:
    # Becomes OpenTelemetry's service.name. Fixed per service on purpose: one shared name
    # across two services would merge their telemetry into one stream (ADR-019).
    name: finassist-ledger

  datasource:
    # Defaults serve the native run: a ledger on the host reaching the Compose database through its
    # published port on localhost. The Compose ledger overrides them with the service name, db. No
    # password default — an unset one should fail to connect, not silently try an empty string.
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/finassist}
    username: ${LEDGER_DB_USERNAME:finassist}
    password: ${LEDGER_DB_PASSWORD:}

  flyway:
    # Locations are left at the default, classpath:db/migration, which Flyway scans recursively.
    # Each context owns a subdirectory and a major version (accounting 1, budgeting 2, planning 3)
    # so the three can never collide on a version or share a file, and the history table stays
    # single (ADR-024).
    enabled: true

logging:
  structured:
    format:
      # JSON on stdout, never a log file. Rotation and shipping belong to whatever runs the
      # container (ADR-019). ECS carries MDC entries, which is how the trace id reaches a line.
      console: ecs
  pattern:
    # Only used when the structured format is turned off; kept so a plain-text run still
    # correlates rather than silently losing the ids.
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false

management:
  endpoints:
    web:
      exposure:
        # An explicit allow-list, never "*". LedgerApplicationIT asserts /actuator/env is 404,
        # which is what stops this being widened by accident.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Splits health into /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      group:
        # Readiness now means something. It was liveness by another name while every adapter was
        # in memory — there was nothing to be unready for, and pointing a probe at an in-memory
        # map would have reported health no dependency had been asked about. With the store real,
        # a ledger that cannot reach its database is not willing to take traffic.
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      # Publishes _bucket series for HTTP timings, which is what a latency quantile is
      # computed from. Without this the collector and the Grafana panel both see a count and a
      # sum and can only show an average, which hides exactly the tail worth looking at.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Single-owner system with no traffic: sampling would trade a resource nobody is short
      # of for gaps in the only traces that exist.
      probability: 1.0
    export:
      otlp:
        # The OTLP exporter's own switch, deliberately not management.tracing.export.enabled.
        # Spring Boot documents that global one as "export and propagate": off, it removes both
        # W3C propagators (OpenTelemetryPropagationConfigurations) and leaves a no-op one, so every
        # request would start a new trace instead of continuing the caller's traceparent.
        # Correlation holds with export off (ADR-019); only export is opt-in. Any tracing exporter
        # added later needs its own management.tracing.export.<name>.enabled set to
        # ${OTEL_EXPORT_ENABLED:false}, because the global switch no longer gates export.
        #
        # Every signal is gated by one flag. Metrics need it as much as traces:
        # spring-boot-starter-opentelemetry drags in micrometer-registry-otlp, which otherwise
        # POSTs to localhost:4318/v1/metrics every minute forever on a machine with no
        # collector — exactly the noise ADR-019's no-op promise exists to avoid.
        enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        # Logs too. Spring Boot maps OTEL_EXPORTER_OTLP_ENDPOINT onto the log exporter's endpoint as
        # well, and OnEnabledLoggingExportCondition treats an unset switch as on, so the endpoint alone
        # builds an OtlpHttpLogRecordExporter with export off. Nothing feeds it until an OpenTelemetry
        # log appender is added; this keeps log export opt-in for the day one is.
        enabled: ${OTEL_EXPORT_ENABLED:false}

# The OTLP endpoint is deliberately not set here. Spring Boot 4.1 registers
# OpenTelemetryEnvironmentVariableEnvironmentPostProcessor, which maps the standard
# OTEL_EXPORTER_OTLP_ENDPOINT (and the signal-specific OTEL_EXPORTER_OTLP_TRACES_ENDPOINT) onto
# these properties itself, with addFirst. A hand-built value here would be discarded whenever
# the variable is set, and would silently ignore the signal-specific one where it is not.
