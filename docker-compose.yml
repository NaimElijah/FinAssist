# The one entry point for running FinAssist locally and in CI (see docs/ADRs/ADR-005).
# The ledger, the gateway and the assistant all run here now, plus Keycloak and its own
# database. `./mvnw spring-boot:run` and `uv run python -m finassist_assistant.adapters` against
# the Compose `db` still work, for the faster native inner loop.
#
# Every published port binds the host's loopback only, as `127.0.0.1:<port>` (ADR-030, carrying
# ADR-027's loopback rule forward now that the services authenticate). PostgreSQL and Grafana
# stand behind a password alone, `keycloak-db` publishes no port at all, and the ledger and the
# assistant still bind loopback in front of a bearer-token check rather than none, so no port may
# be reachable from another machine either way. Containers still reach one another by service
# name on the Compose network, except the two databases: each sits on a network of its own, shared
# with its one client alone (`books`, `identity` below), so no other container can resolve or
# reach either one over a Compose network. That does not cover the host: on Docker Desktop any
# container with a route off its networks still reaches a loopback-published port, `db`'s
# included, through `host.docker.internal`, where only the password stands in the way.
#
# The monitoring services sit behind a `monitoring` profile, so `docker compose up` stays
# database-and-every-service-only and `docker compose --profile monitoring up` adds the
# telemetry backend (ADR-019). The ledger, the gateway and the assistant push OTLP; the ledger is
# also scraped directly by Prometheus, by its Compose service name — a natively-run ledger bound to
# loopback (ADR-030) is not reachable that way. The assistant exposes no metrics endpoint yet, so
# only its OTLP push is collected.
#
# `smoke` is a second, unrelated profile: `auth-smoke` (ops/smoke/auth_smoke.py) checks the
# authentication and RBAC wiring end to end against the services actually running in this
# network. Also never started by a bare `docker compose up`; run it by hand with `make
# smoke-auth` after `make run` reports every service healthy (Refs #38).
name: finassist

# One restart policy and one log bound for every long-running service (ADR-039), stated once and
# applied by alias. Neither goes on the two one-shots, whose failure must stay a failure rather than
# loop: `auth-smoke`, a `compose run --rm`, and `secret-check`, which every `up` runs first
# (ADR-044).
#
# `unless-stopped`: a service that crashes comes back on its own, and so does the whole stack after
# Docker itself restarts, while one stopped on purpose (Ctrl+C on `make run`, `docker compose stop`,
# `make stop`) stays stopped. `on-failure` is rejected: it never restarts a process that exits 0,
# and Docker documents that it "doesn't restart the container if the daemon restarts"
# (docs.docker.com/engine/containers/start-containers-automatically). A crash loop is not silent:
# `docker compose ps` shows the service `Restarting`, and Docker waits longer before each attempt.
# After a Docker restart, Docker restarts the containers itself, without `depends_on`. So the ledger,
# which migrates `db` at start-up, or Keycloak, which needs `keycloak-db`, may exit and be restarted
# a few times until its database is ready.
x-restart-policy: &restart-policy unless-stopped

# The services write JSON to stdout and leave rotation and retention to whatever runs the container
# (ADR-019); under Compose that is this file. Docker's `json-file` driver keeps every line for the
# life of the container unless told otherwise, so each container keeps at most three 10 MB files.
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Least privilege for every container whose image runs as a user of its own and needs no Linux
# capability (ADR-063): every capability dropped, and no process may gain privileges through a
# setuid or file-capability binary. Applied with `<<: *hardened`; `make check-compose` holds every
# service to it but the two it exempts by name, and every one but those and Keycloak to
# `read_only: true`, so a service added later is held to both unless exempted on purpose. Not on
# `db` or `keycloak-db`: the PostgreSQL image's entrypoint starts as root, takes ownership of its
# data and socket directories, then drops to the `postgres` user itself; with every capability
# dropped, its `chmod` and `chown` are refused and it exits. No service, a database included, may
# set `cap_add`, `privileged`, `pid`, `ipc`, `userns_mode`, `uts` or `devices`, run as root by
# `user`, or mount the Docker socket.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # --- Secret check (ADR-044) ----------------------------------------------------------------
  # Refuses to start the stack on a secret that a file in this repository already holds (#302).
  # PostgreSQL applies a password only when it first initialises an empty volume, so the check has
  # to finish before `db` and `keycloak-db` start. Both wait on it, as Grafana does, and every
  # other service that takes a secret waits on one of them. It has no profile, so every `up` runs
  # it again, and anything that starts a database does too: `run`, `--wait` and the restore check.
  secret-check:
    # The exact tag auth-smoke and backend/assistant/Dockerfile use; the script is standard library.
    image: python:3.13.18-slim-trixie
    # nobody:nogroup, and no network at all: it reads its environment and the files below, and
    # talks to nothing.
    user: "65534:65534"
    network_mode: none
    <<: *hardened
    # Nothing in its root filesystem is written: it reads its environment and the clone.
    read_only: true
    volumes:
      # The whole clone, read-only. The script decides what to read the way git decides what to
      # track, so `.env`, the backups and the build output are mounted but never opened.
      - ./:/repo:ro
    environment:
      # `:-` rather than `:?`: each service that uses a secret already refuses it unset, and the
      # check skips an empty one rather than matching it in every file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      FINASSIST_OWNER_INITIAL_PASSWORD: ${FINASSIST_OWNER_INITIAL_PASSWORD:-}
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:-}
      ASSISTANT_CLIENT_SECRET: ${ASSISTANT_CLIENT_SECRET:-}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      # Nothing here may be written, and this user could not write it anyway.
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "/repo/ops/secret_check/secret_check.py", "/repo"]

  db:
    image: postgres:18.6-trixie
    restart: *restart-policy
    logging: *bounded-logs
    depends_on:
      secret-check:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finassist}
      POSTGRES_USER: ${POSTGRES_USER:-finassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # On `books` alone, which only the ledger shares, so no other container can resolve or reach
    # `db` over a Compose network. Its published port below is another matter: on Docker Desktop
    # any container with a route off its networks reaches it through `host.docker.internal`, with
    # only the password in the way.
    networks: [books]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 18+ moved the volume up from .../data; PGDATA is /var/lib/postgresql/18/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finassist} -d ${POSTGRES_DB:-finassist}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ledger:
    build: ./backend/ledger
    restart: *restart-policy
    logging: *bounded-logs
    <<: *hardened
    # The JVM writes only under /tmp: its perf data and Tomcat's work and docbase directories.
    read_only: true
    tmpfs: [/tmp]
    # `default` for everything that calls it, `books` for its database.
    networks: [default, books]
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Loopback only, kept as defence in depth now that every business request also needs a
    # bearer token (ADR-030) — the published port must not be reachable from outside this
    # machine even though the container itself binds every interface (see LEDGER_ADDRESS below).
    ports:
      - "127.0.0.1:${LEDGER_PORT:-8080}:8080"
    environment:
      # The container's own loopback is unreachable from outside the container, so the interface
      # it binds has to be every one of them; the host-side port mapping above is what stays on
      # 127.0.0.1 (ADR-030).
      LEDGER_ADDRESS: 0.0.0.0
      # `ledger` — this service's own Compose DNS name — lets Prometheus scrape it below.
      LEDGER_ALLOWED_HOSTS: localhost,127.0.0.1,ledger
      LEDGER_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-finassist}
      LEDGER_DB_USERNAME: ${LEDGER_DB_USERNAME:-finassist}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}
      # A token's iss is always the public URL a browser signed in against (ADR-030, ADR-031).
      LEDGER_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/finassist
      # Fetched service-to-service, so this is the container-to-container address, never the
      # published port — "localhost" inside a container means the container itself.
      LEDGER_OIDC_JWKS_URI: http://keycloak:8080/realms/finassist/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
    healthcheck:
      # The runtime image is eclipse-temurin's Ubuntu Noble base, which carries curl already, so
      # this costs no extra tool install.
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  assistant:
    build: ./backend/assistant
    restart: *restart-policy
    logging: *bounded-logs
    <<: *hardened
    # It writes nothing to its root filesystem: its bytecode is compiled into the image.
    read_only: true
    depends_on:
      keycloak:
        condition: service_healthy
    # Loopback only, kept as defence in depth now that every business request also needs a
    # bearer token (ADR-030) — the published port must not be reachable from outside this
    # machine even though the container itself binds every interface (see ASSISTANT_HOST below).
    ports:
      - "127.0.0.1:${ASSISTANT_PORT:-8000}:8000"
    environment:
      # The container's own loopback is unreachable from outside the container, so the interface
      # it binds has to be every one of them; the host-side port mapping above is what stays on
      # 127.0.0.1 (ADR-030).
      ASSISTANT_HOST: 0.0.0.0
      ASSISTANT_PORT: 8000
      # `assistant` — this service's own Compose DNS name, so a request reaching it that way
      # inside this network is not refused. Nothing does yet: unlike the ledger, the assistant
      # exposes no metrics endpoint, so Prometheus does not scrape it (see ops/prometheus.yml).
      ASSISTANT_ALLOWED_HOSTS: localhost,127.0.0.1,assistant
      ASSISTANT_DEV_SEED: ${ASSISTANT_DEV_SEED:-false}
      ASSISTANT_LOG_LEVEL: ${ASSISTANT_LOG_LEVEL:-INFO}
      # A token's iss is always the public URL a browser signed in against (ADR-030, ADR-031).
      ASSISTANT_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/finassist
      # Fetched service-to-service, so this is the container-to-container address, never the
      # published port — "localhost" inside a container means the container itself.
      ASSISTANT_OIDC_JWKS_URI: http://keycloak:8080/realms/finassist/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      # No ANTHROPIC_API_KEY: nothing reads it at start-up today. `assistance` is written and
      # deliberately unwired (adapters/wiring.py) — an LLM adapter would settle the requirements'
      # open privacy question by implication, so this waits on that decision, not on Compose.
    healthcheck:
      # Readiness, not liveness: `service_healthy` must mean "can serve", and `/ready` is the one
      # endpoint that becomes a real check once the ledger client exists (#62) — probing `/health`
      # would leave Compose blind to that change. python:3.13-slim carries no curl; the interpreter
      # already in the image is enough. The Host header urllib sends is `localhost:8000`, which
      # ASSISTANT_ALLOWED_HOSTS admits — the check compares only the text before the header's
      # first colon (ADR-030).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- Identity (ADR-030, ADR-031) ----------------------------------------------------------
  keycloak-db:
    # A PostgreSQL major Keycloak 26.8 supports: keycloak.org/server/supported-configurations
    # lists 17 and 18. The ledger's own `db` is already on 18. Moving this one too is a major
    # upgrade by dump and restore, not a tag change (#314), so until then the two run different
    # majors.
    image: postgres:17.11-trixie
    restart: *restart-policy
    logging: *bounded-logs
    depends_on:
      secret-check:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    # On `identity` alone, which only Keycloak shares.
    networks: [identity]
    # No published port: nothing outside this network ever calls it directly, and it shares no
    # role, no backup and no failure domain with the ledger's own database (ADR-031). No init
    # script either, so the owner's existing `db-data` volume is never touched by this service —
    # `keycloak-db-data` is its own, separate volume.
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    build: ./ops/keycloak
    restart: *restart-policy
    logging: *bounded-logs
    <<: *hardened
    # `default` for the services that fetch tokens and keys, `identity` for its database.
    networks: [default, identity]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      # The browser reaches Keycloak here; every token's `iss` names this address, never the
      # backchannel one (ADR-031). `KC_HOSTNAME_BACKCHANNEL_DYNAMIC` is confirmed in Keycloak's
      # own hostname documentation: it lets a container reach the same realm at its own service
      # name, `http://keycloak:8080`, without moving the issuer.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Plain HTTP: everything here stays on loopback, exactly like the ledger and the assistant
      # (ADR-030). sslRequired: external in the realm itself still refuses a non-loopback caller
      # without TLS.
      KC_HTTP_ENABLED: "true"
      # JSON on stdout, as every other service writes it (ADR-019); Keycloak's default is plain
      # text. A runtime option, so it is set here rather than baked in by `kc.sh build`.
      KC_LOG_CONSOLE_OUTPUT: json
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Every placeholder ops/keycloak/finassist-realm.json names. The three secrets -
      # GATEWAY_CLIENT_SECRET, ASSISTANT_CLIENT_SECRET and FINASSIST_OWNER_INITIAL_PASSWORD - are
      # required through `:?`: Keycloak itself imports a missing one as the literal, unresolved
      # placeholder text rather than refusing to start (observed against the real image when this
      # file was drafted), so this `:?` is the control that actually stops that, not the realm
      # file. GATEWAY_PUBLIC_URL and FINASSIST_OWNER_USERNAME are not secret and take `:-`
      # defaults instead, so they are always set too.
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?set GATEWAY_CLIENT_SECRET in .env}
      ASSISTANT_CLIENT_SECRET: ${ASSISTANT_CLIENT_SECRET:?set ASSISTANT_CLIENT_SECRET in .env}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:5173}
      FINASSIST_OWNER_USERNAME: ${FINASSIST_OWNER_USERNAME:-owner}
      FINASSIST_OWNER_INITIAL_PASSWORD: ${FINASSIST_OWNER_INITIAL_PASSWORD:?set FINASSIST_OWNER_INITIAL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      # The image carries no curl, but it does carry bash (confirmed against the built image),
      # so the management port's readiness probe is read with bash's own `/dev/tcp`, the same
      # technique the ledger's own tests use to write a request by hand. Judge readiness by the
      # HTTP status line, not the body: `/health/ready`'s body lists sub-checks, and "Graceful
      # Shutdown" reports UP within seconds of boot while "Keycloak Initialized" is still DOWN
      # and the realm import hasn't run — a body grep for any `"status":"UP"` matches that
      # sub-check and calls the container healthy long before it can issue a token. Reading only
      # the status line agrees with `KeycloakRealmIT.java`'s own
      # `Wait.forHttp("/health/ready").forStatusCode(200)`.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -Eq '^HTTP/[0-9.]+ 200'
      interval: 5s
      timeout: 3s
      retries: 10
      # Measured on this machine from a fresh volume: ~100s to the first real 200 with the rest
      # of the stack starting alongside it; a slower run on this machine saw ~150s. A probe success
      # inside start_period still marks the container healthy immediately, so this costs nothing
      # on a fast start; it only stops a correct, slower check from failing the container outright.
      start_period: 240s

  gateway:
    build: ./backend/gateway
    restart: *restart-policy
    logging: *bounded-logs
    <<: *hardened
    # As the ledger: the JVM writes only under /tmp.
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      keycloak:
        condition: service_healthy
    # Loopback only (ADR-030) — the gateway is what the browser talks to directly, so its
    # published port carries exactly the same defence as the ledger's and the assistant's.
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:8090"
    environment:
      # The container's own loopback is unreachable from the host, so the interface it binds has
      # to be every one of them; the host-side port mapping above is what stays on 127.0.0.1.
      GATEWAY_ADDRESS: 0.0.0.0
      # `gateway` — this service's own Compose DNS name — so a relayed call the ledger or the
      # assistant logs by Host still resolves, and so the web client's own dev proxy can add it
      # once it reaches the gateway that way.
      GATEWAY_ALLOWED_HOSTS: localhost,127.0.0.1,gateway
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:5173}
      GATEWAY_OIDC_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8081}
      # The gateway's own HTTP client reaches Keycloak by its Compose service name, never the
      # published port — "localhost" inside a container means the container itself (ADR-031).
      GATEWAY_OIDC_INTERNAL_URL: http://keycloak:8080
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?set GATEWAY_CLIENT_SECRET in .env}
      GATEWAY_COOKIE_SECURE: ${GATEWAY_COOKIE_SECURE:-false}
      GATEWAY_LEDGER_URI: http://ledger:8080
      GATEWAY_ASSISTANT_URI: http://assistant:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
    healthcheck:
      # Readiness, like the ledger's, so `service_healthy` means ready to serve rather than merely
      # alive. The runtime image is eclipse-temurin's Ubuntu Noble base, which carries curl already.
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # --- Monitoring (profile: monitoring) ---------------------------------------------------
  # Receives OTLP from the ledger, the gateway and the assistant, and re-exposes metrics for
  # Prometheus to scrape. The services talk OTLP and nothing else, so replacing this backend never
  # touches their code.
  otel-collector:
    profiles: [monitoring]
    image: otel/opentelemetry-collector-contrib:0.139.0
    restart: *restart-policy
    logging: *bounded-logs
    <<: *hardened
    # It writes nothing: its configuration is mounted read-only and it stores no telemetry.
    read_only: true
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.7.3
    restart: *restart-policy
    logging: *bounded-logs
    <<: *hardened
    # It writes only to its `prometheus-data` volume.
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # No origin may read the API cross-origin (ADR-057). Prometheus defaults this regex to `.*`
      # and echoes any Origin back as allowed. The regex is fully anchored, so the empty one
      # matches only an empty Origin, which Prometheus never answers with a grant. Grafana queries
      # over the Compose network (`access: proxy`) and Prometheus's own UI is same-origin, so
      # neither needs one.
      - --web.cors.origin=
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.3.1
    restart: *restart-policy
    logging: *bounded-logs
    <<: *hardened
    # It writes to its `grafana-data` volume, and under /tmp as it downloads the plugins it
    # installs at start-up.
    read_only: true
    tmpfs: [/tmp]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Local-only tool with one operator; an anonymous sign-up flow would be a login screen
      # protecting nothing. It is still password-protected rather than open.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      secret-check:
        condition: service_completed_successfully

  # --- Smoke test (profile: smoke) ---------------------------------------------------------
  # ops/smoke/auth_smoke.py, run once by hand (`make smoke-auth`), never as part of `docker
  # compose up`. It reaches Keycloak, the ledger, the assistant and the gateway by their Compose
  # DNS names, on the network this service joins by being declared here, which is the point: it
  # checks the wiring this file gives them (service names and ports, issuers, JWKS URIs, Host
  # allow-lists, public URLs), which each service's own suite, booted alone with its own test
  # settings, never sees (Refs #38).
  auth-smoke:
    profiles: [smoke]
    # The exact tag backend/assistant/Dockerfile already builds from, so it is proven to exist
    # and the two stay pinned to the same Debian trixie generation of Python 3.13.
    image: python:3.13.18-slim-trixie
    # nobody:nogroup. The script needs no privilege, and this container holds a client secret,
    # so it runs as a user that owns nothing, as the three application images already drop to a
    # system user of their own.
    user: "65534:65534"
    <<: *hardened
    # Nothing in its root filesystem is written: its script is mounted read-only.
    read_only: true
    depends_on:
      keycloak:
        condition: service_healthy
      ledger:
        condition: service_healthy
      assistant:
        condition: service_healthy
      gateway:
        condition: service_healthy
    volumes:
      - ./ops/smoke/auth_smoke.py:/auth_smoke.py:ro
    environment:
      # Fetches the one client-credentials token every check after the first reuses.
      ASSISTANT_CLIENT_SECRET: ${ASSISTANT_CLIENT_SECRET:?set ASSISTANT_CLIENT_SECRET in .env}
      # The public bases a browser uses, which `.env` can move. Not secret. Built from exactly
      # the expressions KC_HOSTNAME, the two issuers and the gateway's GATEWAY_PUBLIC_URL use
      # above, so the check expects what this stack was actually configured with. Service names
      # and the ports they listen on inside this network are fixed here, so the script keeps
      # those as constants.
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8081}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:5173}
      # Nothing here should be written, and this user could not write it anyway: the script's
      # own mount is read-only. So bytecode caching is switched off outright.
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "/auth_smoke.py"]

# Each database shares a network with its one client alone. `identity` is `internal`, so
# `keycloak-db`, which publishes no port, has no route off it; Keycloak keeps its egress through
# `default`. `books` cannot be: `db` publishes its port to the host's loopback, and Docker
# publishes no port from a container on an internal network alone.
networks:
  books:
  identity:
    internal: true

volumes:
  db-data:
  keycloak-db-data:
  prometheus-data:
  grafana-data:
