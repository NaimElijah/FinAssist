# The one entry point for running FinAssist locally and in CI (see docs/ADRs/ADR-005).
# Both backend services run here now that each has something to serve. `./mvnw spring-boot:run`
# and `uv run python -m finassist_assistant.adapters` against the Compose `db` still work, for
# the faster native inner loop.
#
# Every published port binds the host's loopback only, as `127.0.0.1:<port>` (ADR-027). The
# ledger, the assistant, the collector and Prometheus authenticate no caller, and PostgreSQL and
# Grafana stand behind a password alone, so no port may be reachable from another machine.
# Containers still reach one another by service name on the Compose network, which this leaves
# untouched.
#
# The monitoring services sit behind a `monitoring` profile, so `docker compose up` stays
# database-and-both-services-only and `docker compose --profile monitoring up` adds the
# telemetry backend (ADR-019). Both services push OTLP; the ledger is also scraped directly by
# Prometheus, by its Compose service name — a natively-run ledger bound to loopback (ADR-027) is
# not reachable that way. The assistant exposes no metrics endpoint yet, so only its OTLP push
# is collected.
name: finassist

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finassist}
      POSTGRES_USER: ${POSTGRES_USER:-finassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 18+ moved the volume up from .../data; PGDATA is /var/lib/postgresql/18/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finassist} -d ${POSTGRES_DB:-finassist}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ledger:
    build: ./backend/ledger
    depends_on:
      db:
        condition: service_healthy
    # Loopback only, per ADR-027 — the ledger has no authentication, so the published port must
    # not be reachable from outside this machine even though the container itself binds every
    # interface (see LEDGER_ADDRESS below).
    ports:
      - "127.0.0.1:${LEDGER_PORT:-8080}:8080"
    environment:
      # The container's own loopback is unreachable from outside the container, so the interface
      # it binds has to be every one of them; the host-side port mapping above is what stays on
      # 127.0.0.1 (ADR-027).
      LEDGER_ADDRESS: 0.0.0.0
      # `ledger` — this service's own Compose DNS name — lets Prometheus scrape it below.
      LEDGER_ALLOWED_HOSTS: localhost,127.0.0.1,ledger
      LEDGER_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-finassist}
      LEDGER_DB_USERNAME: ${LEDGER_DB_USERNAME:-finassist}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
    healthcheck:
      # The runtime image is eclipse-temurin's Ubuntu Noble base, which carries curl already, so
      # this costs no extra tool install.
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  assistant:
    build: ./backend/assistant
    # Loopback only, per ADR-027 — the assistant has no authentication either, so the published
    # port must not be reachable from outside this machine even though the container itself
    # binds every interface (see ASSISTANT_HOST below).
    ports:
      - "127.0.0.1:${ASSISTANT_PORT:-8000}:8000"
    environment:
      # The container's own loopback is unreachable from outside the container, so the interface
      # it binds has to be every one of them; the host-side port mapping above is what stays on
      # 127.0.0.1 (ADR-027).
      ASSISTANT_HOST: 0.0.0.0
      ASSISTANT_PORT: 8000
      # `assistant` — this service's own Compose DNS name, so a request reaching it that way
      # inside this network is not refused. Nothing does yet: unlike the ledger, the assistant
      # exposes no metrics endpoint, so Prometheus does not scrape it (see ops/prometheus.yml).
      ASSISTANT_ALLOWED_HOSTS: localhost,127.0.0.1,assistant
      ASSISTANT_DEV_SEED: ${ASSISTANT_DEV_SEED:-false}
      ASSISTANT_LOG_LEVEL: ${ASSISTANT_LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      # No ANTHROPIC_API_KEY: nothing reads it at start-up today. `assistance` is written and
      # deliberately unwired (adapters/wiring.py) — an LLM adapter would settle the requirements'
      # open privacy question by implication, so this waits on that decision, not on Compose.
    healthcheck:
      # python:3.13-slim carries no curl; the interpreter already in the image is enough. The
      # Host header urllib sends is `localhost:8000`, which ASSISTANT_ALLOWED_HOSTS admits — the
      # check compares only the text before the header's first colon (ADR-027).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- Monitoring (profile: monitoring) ---------------------------------------------------
  # Receives OTLP from both services and re-exposes metrics for Prometheus to scrape. The
  # services talk OTLP and nothing else, so replacing this backend never touches their code.
  otel-collector:
    profiles: [monitoring]
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Local-only tool with one operator; an anonymous sign-up flow would be a login screen
      # protecting nothing. It is still password-protected rather than open.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  db-data:
  prometheus-data:
  grafana-data:
